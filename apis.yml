description: >-
  The Detect Language API is a web service that identifies the language of a given text with high accuracy, whether it's
  a long passage, short phrase, or single word. It supports detection of 164 languages and offers fast performance with
  low latency globally. The API also allows for batch processing, maintains strong security and privacy standards, and
  is available through both free and premium plans.
